<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary Approval Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            color: #F5F0E8;
            font-family: 'Jost', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #272727;
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: #C9A84C;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #807870;
            font-size: 0.95rem;
        }

        /* Login Screen */
        .login-screen {
            display: none;
            max-width: 400px;
            margin: 60px auto;
            padding: 40px;
            background: #111111;
            border: 1px solid #272727;
            border-radius: 8px;
            text-align: center;
        }

        .login-screen.active {
            display: block;
        }

        .login-screen h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #C9A84C;
        }

        .login-screen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #0d0d0d;
            border: 1px solid #272727;
            color: #F5F0E8;
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            border-radius: 4px;
        }

        .login-screen button {
            width: 100%;
            padding: 12px;
            background: #C9A84C;
            color: #0d0d0d;
            border: none;
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .login-screen button:hover {
            opacity: 0.9;
        }

        /* Main Content */
        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #272727;
        }

        .counter {
            color: #807870;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: transparent;
            color: #C9A84C;
            border: 1px solid #C9A84C;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #C9A84C;
            color: #0d0d0d;
        }

        /* Item Display */
        .item-card {
            background: #111111;
            border: 1px solid #272727;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .platform-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #C1593C;
            color: #0d0d0d;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
        }

        .item-date {
            color: #807870;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .item-content {
            background: #0d0d0d;
            padding: 20px;
            border-left: 3px solid #C9A84C;
            border-radius: 4px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 4px;
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            max-width: 200px;
        }

        .btn-approve {
            background: #7d8c6e;
            color: #F5F0E8;
        }

        .btn-approve:hover {
            opacity: 0.9;
        }

        .btn-reject {
            background: #C1593C;
            color: #F5F0E8;
        }

        .btn-reject:hover {
            opacity: 0.9;
        }


        /* Approval decisions: gold buttons, saved in this browser only */
        .decision-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .approved-badge { display:inline-block; margin:0 0 14px; padding:8px 16px; background:#7d8c6e; color:#0d0d0d; font-family:'Jost', sans-serif; font-weight:700; letter-spacing:2px; font-size:0.95rem; border-radius:2px; animation: approvedPulse 2.4s ease-in-out infinite; }
        .ready-badge { display:inline-block; margin:0 0 14px; padding:6px 14px; border:1px solid #C9A84C; color:#C9A84C; font-family:'Jost', sans-serif; letter-spacing:1px; font-size:0.85rem; }
        @keyframes approvedPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @media (prefers-reduced-motion: reduce) { .approved-badge { animation: none; } }
        .btn-gold {
            background: #C9A84C;
            color: #0d0d0d;
            font-weight: 700;
            letter-spacing: 0.02em;
            max-width: 220px;
        }

        .btn-gold:hover {
            opacity: 0.9;
        }

        .btn-gold.chosen {
            outline: 3px solid #F5F0E8;
            outline-offset: 2px;
        }

        .decision-status {
            text-align: center;
            margin-top: 12px;
            font-weight: 600;
            color: #C9A84C;
        }

        .decision-note {
            text-align: center;
            color: #807870;
            font-size: 0.8rem;
            margin-top: 8px;
            line-height: 1.6;
        }

        /* Status */
        .status {
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .status.success {
            background: #7d8c6e;
            color: #0d0d0d;
        }

        .status.error {
            background: #C1593C;
            color: #0d0d0d;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #807870;
        }

        .empty-state h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #C9A84C;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #807870;
        }

        .spinner {
            border: 2px solid #272727;
            border-top: 2px solid #C9A84C;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .item-card { padding: 20px; }
            .actions { flex-direction: column; }
            .btn { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sanctuary Approval Gate</h1>
            <p class="subtitle">Release calendar for the Quiet Authority videos</p>
        </header>

        <!-- Login Screen -->
        <div class="login-screen active" id="loginScreen">
            <h2>Welcome Back</h2>
            <div style="margin-bottom: 20px; color: #807870; font-size: 0.9rem;">
                <p style="margin-bottom: 10px;">First time? Use password: <strong>approve</strong></p>
                <p>You can change it anytime.</p>
            </div>
            <input type="password" id="passwordInput" placeholder="Enter approval password" autocomplete="off">
            <button onclick="login()">Access Gate</button>
            <div id="loginError" style="color: #C1593C; margin-top: 15px; display: none;"></div>
        </div>

        <!-- Main Content -->
        <div class="content" id="content">
            <div class="controls">
                <div class="counter">
                    <span id="itemCounter">Loading...</span>
                </div>
                <button class="logout-btn" onclick="logout()">← Back to Gate</button>
            </div>

            <div id="itemDisplay"></div>
            <div id="statusMessage"></div>
        </div>

        <div id="loadingState" style="display: none;">
            <div class="loading">
                <p>Loading the release calendar...</p>
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        // The release calendar. It reads workflows/output/youtube-schedule.json and shows only those videos,
        // ordered by date. Nothing on this page uploads or moves a file.
        const SCHEDULE_URL = 'workflows/output/youtube-schedule.json';
        let savedPassword = localStorage.getItem('approvalPassword') || 'approve';

        function login() {
            const password = document.getElementById('passwordInput').value;
            if (!password) { showLoginError('Please enter a password'); return; }
            if (password !== savedPassword) { showLoginError('Incorrect password'); return; }
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('content').classList.add('active');
            loadSchedule();
        }

        function showLoginError(msg) {
            const err = document.getElementById('loginError');
            err.textContent = msg;
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 3000);
        }

        function logout() {
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('content').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Approval recorded in workflows/output/youtube-schedule.json. Only a video marked approved there shows the green badge.
        function approvalBadge(v) {
            const a = v.approval;
            if (!a) return '';
            if (a.status === 'approved') return '<div class="approved-badge">APPROVED BY GRACE</div>';
            return '<div class="ready-badge">' + escapeHtml(a.label || 'Ready, Awaiting Review') + '</div>';
        }

        function prettyDate(iso, time) {
            const d = new Date(iso + 'T12:00:00');
            const day = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            return day + ', ' + time + ' Eastern';
        }

        async function loadSchedule() {
            document.getElementById('loadingState').style.display = 'block';
            try {
                const response = await fetch(SCHEDULE_URL + '?v=' + Date.now());
                if (!response.ok) throw new Error('Could not load the schedule');
                const data = await response.json();
                const metrics = await fetchMetrics();
                const thumbs = await fetchThumbs();
                const integrity = await fetchIntegrity();
                const pins = await fetchPins();
                const reels = await fetchReels();
                const videos = data.videos.slice().sort((a, b) => a.date.localeCompare(b.date));
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('itemCounter').textContent = videos.length + ' videos scheduled';
                videoVersions = videos.map(v => v.version);
                updateCounter();
                document.getElementById('itemDisplay').innerHTML = renderIntegrity(integrity) + renderActions(data.action_cards || []) + renderReview(data.pending_review || []) + videos.map(v => `
                    <div class="item-card">
                        <div class="platform-badge">WEEK ${escapeHtml(v.week)} &middot; ${escapeHtml(v.version.toUpperCase())}</div>
                        ${approvalBadge(v)}
                        <div class="item-date">${escapeHtml(prettyDate(v.date, v.time))}</div>
                        <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(v.title)}</h2>
                        <div class="item-content">${escapeHtml(v.chapters.join('\n'))}</div>
                        <div class="actions">
                            <a class="btn btn-approve" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.video)}" target="_blank" rel="noopener">Watch video</a>
                            <a class="btn btn-reject" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.card)}" target="_blank" rel="noopener">Open card</a>
                        </div>
                        <div id="decision-${escapeHtml(v.version)}">${decisionInner(v.version)}</div>
                    </div>`).join('') + `
                    <p class="counter" style="text-align:center;">You upload each video yourself in YouTube Studio and schedule it for the date above. Nothing on this page uploads anything.</p>`
                    + renderThumbnails(thumbs) + renderSystemMap(data, thumbs, pins, reels) + renderPins(pins) + renderInsights(metrics) + renderShorts(data.shorts || []) + renderReels(reels) + (await renderLocalStaging()) + renderNotes(data.status_notes || []);
            } catch (e) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('itemDisplay').innerHTML = '<div class="item-card"><p style="color: #C1593C;">' + escapeHtml(e.message) + '</p></div>';
            }
        }




        // Thumbnail cards for the five master videos, made by scripts/generate-system-thumbnails.mjs.
        async function fetchThumbs() {
            try {
                const r = await fetch('content-ops/02_thumbnail_factory/thumbnails.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        function renderThumbnails(t) {
            const head = '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">Thumbnail Cards</h2>';
            if (!t || !t.cards || !t.cards.length) return head + '<div class="item-card"><p>No thumbnail cards have been made yet.</p></div>';
            const cards = t.cards.map(c => `
                <div class="item-card">
                    <div class="platform-badge">${escapeHtml(String(c.video).toUpperCase())}</div>
                    <a href="${escapeHtml(c.file)}" target="_blank" rel="noopener"><img src="${escapeHtml(c.file)}" alt="Thumbnail card for ${escapeHtml(c.scripture_title.join(' and '))}" style="width:100%; border:1px solid #272727; display:block;"></a>
                    <div class="item-date" style="margin-top:12px;">${escapeHtml(c.scripture_title.join(' and '))}: ${escapeHtml(c.sub)}</div>
                </div>`).join('');
            return head + cards + '<p class="counter" style="text-align:center;">Each card is 1280 by 720, with its scripture title in gold Cinzel inside the 780 pixel text limit.</p>';
        }

        // Engagement Metrics Tracker. It shows only numbers that are in the channel log. Until a video has numbers it says so.
        async function fetchMetrics() {
            try {
                const r = await fetch('workflows/output/engagement-metrics.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        function gauge(label, value, hint) {
            const has = typeof value === 'number';
            const ring = has ? `conic-gradient(#C9A84C ${value}%, #272727 0)` : '#272727';
            return `<div style="text-align:center; width:30%; min-width:110px;">
                <div style="width:96px; height:96px; border-radius:50%; margin:0 auto; background:${ring}; display:flex; align-items:center; justify-content:center;">
                    <div style="width:72px; height:72px; border-radius:50%; background:#0d0d0d; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; font-weight:700; font-size:${has ? '1.7rem' : '0.8rem'}; color:${has ? '#C9A84C' : '#807870'};">${has ? Math.round(value) + '%' : 'no data yet'}</div>
                </div>
                <div style="margin-top:8px; font-size:0.85rem;">${escapeHtml(label)}</div>
                <div style="font-size:0.72rem; color:#807870;">${escapeHtml(hint)}</div>
            </div>`;
        }

        function renderInsights(m) {
            const head = '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">Engagement Metrics Tracker</h2>';
            if (!m || !m.suites) return head + '<div class="item-card"><p>The tracker has not been set up yet.</p></div>';
            const cards = m.suites.map(x => `
                <div class="item-card">
                    <div class="platform-badge">${escapeHtml(x.id.toUpperCase())}</div>
                    <div class="item-date">${escapeHtml(x.title)}${x.has_data ? '' : ' (not out yet, or no numbers yet)'}</div>
                    <div style="display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap;">
                        ${gauge('Hook rate', x.hook_rate, 'still watching at 30 seconds')}
                        ${gauge('Retention drop-off', x.retention_dropoff, 'left before the end')}
                        ${gauge('Traffic redirection', x.traffic_redirection, 'clicked to sanctuary-grace.com')}
                    </div>
                </div>`).join('');
            const rows = m.pairs.map(p => `
                <div style="display:flex; gap:12px; justify-content:space-between; padding:10px 0; border-top:1px solid #272727;">
                    <div>${escapeHtml(p.video.toUpperCase())} paired with ${p.short ? 'Clip ' + escapeHtml(p.short.clip) + ': ' + escapeHtml(p.short.name) : 'no short numbers yet'}</div>
                    <div style="color:#C9A84C;">${p.short ? escapeHtml(p.short.score) + ' engagement' : ''}</div>
                </div>`).join('');
            const pairs = '<div class="item-card"><div class="platform-badge">TOP SHORT FOR EACH VIDEO</div><div class="item-date">Sorted from highest engagement to lowest</div>' + rows + '</div>';
            return head + cards + pairs + '<p class="counter" style="text-align:center;">These numbers come only from the channel log. Nothing here is estimated. Updated ' + escapeHtml(m.updated) + '.</p>';
        }

        // Visual integrity result from scripts/verify-visual-integrity.mjs. A video that fails shows as BLOCKED.
        async function fetchIntegrity() {
            try {
                const r = await fetch('workflows/output/visual-integrity.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        function renderIntegrity(v) {
            if (!v || !v.videos) return '';
            const blocked = !v.layout_ok || v.videos.some(x => !x.ok);
            const rows = v.videos.map(x => `
                <div style="padding:8px 0; border-top:1px solid #272727; color:${x.ok ? '#F5F0E8' : '#C1593C'};">
                    ${escapeHtml(x.video)}: ${x.ok ? 'ready, passed. ' + escapeHtml(x.frames) + ' frames, longest black run before the fade ' + escapeHtml(x.longest_black_run_before_fade) + ' frames, longest still page ' + escapeHtml(x.longest_frozen_run_seconds) + ' seconds' : 'BLOCKED. ' + escapeHtml(x.problems.join(' '))}
                </div>`).join('');
            return `
                <div class="item-card" style="border-color:${blocked ? '#C1593C' : '#C9A84C'};">
                    <div class="platform-badge">VISUAL INTEGRITY, ${escapeHtml(v.checked)}</div>
                    <div class="item-date">${blocked ? 'BLOCKED. Do not approve until this is fixed.' : 'Passed. All six videos are ready for your decision below.'}</div>
                    <p>${escapeHtml(v.rule)} The picture and music fade out together over the last 8 seconds. That final fade is part of the standard and is not counted.</p>
                    ${(v.notes || []).map(n => `<p>${escapeHtml(n)}</p>`).join('')}
                    ${rows}
                </div>`;
        }

        // Action and status cards for Grace, shown at the very top of the gate.
        function renderActions(cards) {
            return cards.map(c => `
                <div class="item-card" style="border-color:#C1593C;">
                    <div class="platform-badge">${escapeHtml(c.badge)}</div>
                    <div class="item-date">${escapeHtml(c.status)}</div>
                    <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(c.title)}</h2>
                    <div class="item-content">${escapeHtml(c.steps.join('\n'))}</div>
                    <p class="counter" style="margin-top:14px;">${escapeHtml(c.note)}</p>
                </div>`).join('');
        }

        // New videos waiting for Grace's review, shown at the very top, before the release calendar.
        function renderReview(items) {
            return items.map(v => `
                <div class="item-card" style="border-color:#C9A84C;">
                    <div class="platform-badge">${escapeHtml(v.label)} &middot; ${escapeHtml(v.series)} &middot; ${escapeHtml(v.version.toUpperCase())}</div>
                    <div class="item-date">${escapeHtml(v.note)}</div>
                    <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(v.title)}</h2>
                    <div class="item-content">${escapeHtml(v.chapters.join('\n'))}</div>
                    <div class="actions">
                        <a class="btn btn-approve" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.video)}" target="_blank" rel="noopener">Watch video</a>
                        <a class="btn btn-reject" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.card)}" target="_blank" rel="noopener">Open card</a>
                    </div>
                </div>`).join('');
        }

        // The 60 second vertical shorts, grouped by the video they come from. Post each one after its full video is out.
        function renderShorts(shorts) {
            if (!shorts.length) return '';
            const order = ['v8', 'v9', 'v11', 'v10', 'v12', 'v13'];
            const groups = order.map(vid => {
                const clips = shorts.filter(x => x.video === vid);
                if (!clips.length) return '';
                const date = clips[0].full_video_date ? prettyDate(clips[0].full_video_date, '5:00 AM') : 'a Sunday still to be chosen';
                const rows = clips.map(x => `
                    <div style="display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid #272727; ${x.skip ? 'opacity:0.5;' : ''}">
                        <div>Clip ${escapeHtml(x.clip)}: ${escapeHtml(x.name)}${x.skip ? ' (skip: ' + escapeHtml(x.skip_reason) + ')' : ''}</div>
                        <div style="display:flex; gap:10px;">
                            <a href="${escapeHtml(x.file)}" target="_blank" rel="noopener" style="color:#C9A84C;">Watch</a>
                            <a href="${escapeHtml(x.caption)}" target="_blank" rel="noopener" style="color:#C9A84C;">Caption</a>
                        </div>
                    </div>`).join('');
                return `<div class="item-card"><div class="platform-badge">SHORTS &middot; ${escapeHtml(vid.toUpperCase())}</div><div class="item-date">Post after the full video, ${escapeHtml(date)}</div>${rows}</div>`;
            }).join('');
            return '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">Shorts, Reels and Pins</h2>' + groups +
                '<p class="counter" style="text-align:center;">Each short ends by pointing to the full video and sanctuary-grace.com. The caption file has the YouTube, Instagram and Pinterest text. You post every short yourself.</p>';
        }


        // Pinterest Idea Pins (content-ops/03_pinterest_pins/pins.json) and the daily Instagram Reel plan
        // (workflows/output/shorts-staged/instagram-daily-schedule.json). Grace posts and pins everything by hand.
        async function fetchPins() {
            try {
                const r = await fetch('content-ops/03_pinterest_pins/pins.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }
        async function fetchReels() {
            try {
                const r = await fetch('workflows/output/shorts-staged/instagram-daily-schedule.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }
        const H2 = '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">';

        function renderSystemMap(data, thumbs, pins, reels) {
            const nVideos = (data.videos || []).length;
            const nThumbs = thumbs && thumbs.cards ? thumbs.cards.length : 0;
            const nShorts = (data.shorts || []).filter(x => !x.skip).length;
            const nPins = pins && pins.pins ? pins.pins.length : 0;
            const nReels = reels && reels.days ? reels.days.length : 0;
            const row = (label, n, where, how) => `
                <div style="padding:10px 0; border-top:1px solid #272727;">
                    <div style="display:flex; justify-content:space-between; gap:12px;"><div>${escapeHtml(label)}</div><div style="color:#C9A84C; font-weight:700;">${n}</div></div>
                    <div style="font-size:0.78rem; color:#807870;">${escapeHtml(where)}. ${escapeHtml(how)}</div>
                </div>`;
            return H2 + 'System Map</h2>' + `
                <div class="item-card">
                    <div class="platform-badge">FROM ONE VIDEO TO EVERY PLATFORM</div>
                    <div class="item-date">Each step feeds the next. You publish every piece by hand.</div>
                    ${row('Master videos', nVideos, 'public/', 'Uploaded by you in YouTube Studio, Sundays at 5:00 AM Eastern')}
                    ${row('Thumbnail cards', nThumbs, 'content-ops/02_thumbnail_factory/', 'One per video')}
                    ${row('Vertical Shorts', nShorts, 'public/shorts/', 'Posted after the full video, with the caption document beside each')}
                    ${row('Pinterest Idea Pins', nPins, 'content-ops/03_pinterest_pins/', 'Pinned by you, destination https://sanctuary-grace.com')}
                    ${row('Instagram Reels, one a day', nReels, 'workflows/output/shorts-staged/instagram-daily/', 'Posted by you, Monday to Wednesday after each video')}
                    <p class="counter" style="margin-top:14px;">Every automatic posting schedule is switched off (Pinterest, Instagram, YouTube agent, Substack). Nothing on this page posts anything.</p>
                </div>`;
        }

        function renderPins(p) {
            if (!p || !p.pins || !p.pins.length) return '';
            const cards = p.pins.map(x => `
                <div class="item-card">
                    <div class="platform-badge">IDEA PIN &middot; ${escapeHtml(String(x.video).toUpperCase())}</div>
                    <a href="${escapeHtml(x.file)}" target="_blank" rel="noopener"><img src="${escapeHtml(x.file)}" alt="Idea Pin for ${escapeHtml(x.scripture_title.join(' and '))}" style="width:100%; max-width:360px; margin:0 auto; border:1px solid #272727; display:block;"></a>
                    <div class="item-date" style="margin-top:12px;">${escapeHtml(x.title)}</div>
                    <p style="font-size:0.9rem;">${escapeHtml(x.description)}</p>
                    <p class="counter">Destination: ${escapeHtml(x.destination_link)}</p>
                </div>`).join('');
            return H2 + 'Pinterest Idea Pins</h2>' + cards + '<p class="counter" style="text-align:center;">Each pin is 1080 by 1920 with its scripture title in gold Cinzel inside the 780 pixel text limit. You pin them by hand.</p>';
        }

        function renderReels(r) {
            if (!r || !r.days || !r.days.length) return '';
            const order = ['v8', 'v9', 'v11', 'v10', 'v12', 'v13'];
            const groups = order.map(vid => {
                const days = r.days.filter(x => x.video === vid);
                if (!days.length) return '';
                const rows = days.map(x => `
                    <div style="display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid #272727;">
                        <div>${escapeHtml(x.weekday)}, ${escapeHtml(x.date)}: Clip ${escapeHtml(x.clip)}, ${escapeHtml(x.name)}</div>
                        <div style="display:flex; gap:10px;">
                            <a href="${escapeHtml(x.file)}" target="_blank" rel="noopener" style="color:#C9A84C;">Watch</a>
                            <a href="${escapeHtml(x.template)}" target="_blank" rel="noopener" style="color:#C9A84C;">Template</a>
                        </div>
                    </div>`).join('');
                return `<div class="item-card"><div class="platform-badge">INSTAGRAM REELS &middot; ${escapeHtml(vid.toUpperCase())}</div><div class="item-date">Post after the full video, ${escapeHtml(days[0].full_video_date)}</div>${rows}</div>`;
            }).join('');
            return H2 + 'Instagram Reels, One a Day</h2>' + groups + '<p class="counter" style="text-align:center;">Each template holds the step by step for the day, the caption and the bio line "' + escapeHtml(r.cta) + '". The Instagram workflows stay paused.</p>';
        }

        // LOCAL STAGING ONLY. This section appears only when the gate is opened from a local test address.
        // On sanctuary-grace.com it fetches nothing and shows nothing.
        function isLocalView() {
            const h = location.hostname;
            return location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1';
        }
        async function renderLocalStaging() {
            if (!isLocalView()) return '';
            try {
                const r = await fetch('workflows/output/local-staging.json?v=' + Date.now());
                if (!r.ok) return '';
                const st = await r.json();
                let pin = null;
                try {
                    const pr = await fetch('content-ops/03_pinterest_pins/pins-staged.json?v=' + Date.now());
                    if (pr.ok) pin = await pr.json();
                } catch (e) { /* no staged pin yet */ }
                const cards = (st.videos || []).map(v => {
                    const p = pin && pin.pins ? pin.pins.find(x => x.video === v.version) : null;
                    return `
                    <div class="item-card" style="border-color:#C1593C;">
                        <div class="platform-badge">LOCAL STAGING ONLY &middot; WEEK ${escapeHtml(v.week)} &middot; ${escapeHtml(v.version.toUpperCase())}</div>
                        <div class="item-date">${escapeHtml(prettyDate(v.date, v.time))}</div>
                        <div class="ready-badge">${escapeHtml(v.status)}</div>
                        <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(v.title)}</h2>
                        <div class="item-content">${escapeHtml(v.chapters.join('\n'))}</div>
                        ${p ? `<a href="${escapeHtml(p.file)}" target="_blank" rel="noopener"><img src="${escapeHtml(p.file)}" alt="Staged Idea Pin for ${escapeHtml(p.scripture_title.join(' and '))}" style="width:100%; max-width:360px; margin:16px auto 0; border:1px solid #272727; display:block;"></a>` : ''}
                        <p class="counter" style="margin-top:12px;">Words and plan: ${escapeHtml(v.data)} and ${escapeHtml(v.plan)}. Not rendered yet. Not shown on the live site.</p>
                    </div>`;
                }).join('');
                return H2 + 'Week 7 Local Staging (offline view only)</h2>' + cards;
            } catch (e) { return ''; }
        }

        // Short status notes at the bottom of the gate.
        function renderNotes(notes) {
            return notes.map(n => `<div class="item-card"><div class="platform-badge">${escapeHtml(n.badge)}</div><p>${escapeHtml(n.text)}</p></div>`).join('');
        }


        // Approval decisions. "Yes, Approve" and "No, Rebuild" are saved in this browser only.
        // They do not upload or publish anything. Press the same button again to take the choice back.
        const DECISION_KEY = 'tqaDecisions';
        let videoVersions = [];
        function loadDecisions() {
            try { return JSON.parse(localStorage.getItem(DECISION_KEY)) || {}; } catch (e) { return {}; }
        }
        function saveDecisions(d) {
            try { localStorage.setItem(DECISION_KEY, JSON.stringify(d)); return true; } catch (e) { return false; }
        }
        function decisionText(rec) {
            if (!rec) return 'No decision yet.';
            const when = new Date(rec.at).toLocaleString('en-US', { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
            return rec.choice === 'approve' ? 'Approved by you on ' + when + '.' : 'Rebuild requested on ' + when + '.';
        }
        function decisionInner(version) {
            const rec = loadDecisions()[version];
            const v = escapeHtml(version);
            return `<div class="decision-row">
                    <button class="btn btn-gold${rec && rec.choice === 'approve' ? ' chosen' : ''}" data-decide="approve" data-version="${v}">Yes, Approve</button>
                    <button class="btn btn-gold${rec && rec.choice === 'rebuild' ? ' chosen' : ''}" data-decide="rebuild" data-version="${v}">No, Rebuild</button>
                </div>
                <div class="decision-status">${escapeHtml(decisionText(rec))}</div>
                <div class="decision-note">Saved on this device only. Nothing uploads or publishes. Tell Claude your choice so it is written into the files.</div>`;
        }
        function updateCounter() {
            const d = loadDecisions();
            const approved = videoVersions.filter(x => d[x] && d[x].choice === 'approve').length;
            const rebuild = videoVersions.filter(x => d[x] && d[x].choice === 'rebuild').length;
            document.getElementById('itemCounter').textContent = videoVersions.length + ' videos scheduled, ' + approved + ' approved' + (rebuild ? ', ' + rebuild + ' to rebuild' : '');
        }
        document.getElementById('itemDisplay').addEventListener('click', (e) => {
            const b = e.target.closest('[data-decide]');
            if (!b) return;
            const version = b.getAttribute('data-version');
            const choice = b.getAttribute('data-decide');
            const d = loadDecisions();
            if (d[version] && d[version].choice === choice) delete d[version];
            else d[version] = { choice: choice, at: new Date().toISOString() };
            const saved = saveDecisions(d);
            const box = document.getElementById('decision-' + version);
            box.innerHTML = decisionInner(version);
            if (!saved) box.querySelector('.decision-status').textContent = 'This browser would not save the choice. Please tell Claude instead.';
            updateCounter();
        });

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
