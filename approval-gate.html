<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary Approval Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            color: #F5F0E8;
            font-family: 'Jost', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #272727;
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: #C9A84C;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #807870;
            font-size: 0.95rem;
        }

        /* Login Screen */
        .login-screen {
            display: none;
            max-width: 400px;
            margin: 60px auto;
            padding: 40px;
            background: #111111;
            border: 1px solid #272727;
            border-radius: 8px;
            text-align: center;
        }

        .login-screen.active {
            display: block;
        }

        .login-screen h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #C9A84C;
        }

        .login-screen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #0d0d0d;
            border: 1px solid #272727;
            color: #F5F0E8;
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            border-radius: 4px;
        }

        .login-screen button {
            width: 100%;
            padding: 12px;
            background: #C9A84C;
            color: #0d0d0d;
            border: none;
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .login-screen button:hover {
            opacity: 0.9;
        }

        /* Main Content */
        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #272727;
        }

        .counter {
            color: #807870;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: transparent;
            color: #C9A84C;
            border: 1px solid #C9A84C;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #C9A84C;
            color: #0d0d0d;
        }

        /* Item Display */
        .item-card {
            background: #111111;
            border: 1px solid #272727;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .platform-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #C1593C;
            color: #0d0d0d;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
        }

        .item-date {
            color: #807870;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .item-content {
            background: #0d0d0d;
            padding: 20px;
            border-left: 3px solid #C9A84C;
            border-radius: 4px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 4px;
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            max-width: 200px;
        }

        .btn-approve {
            background: #7d8c6e;
            color: #F5F0E8;
        }

        .btn-approve:hover {
            opacity: 0.9;
        }

        .btn-reject {
            background: #C1593C;
            color: #F5F0E8;
        }

        .btn-reject:hover {
            opacity: 0.9;
        }

        /* Status */
        .status {
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .status.success {
            background: #7d8c6e;
            color: #0d0d0d;
        }

        .status.error {
            background: #C1593C;
            color: #0d0d0d;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #807870;
        }

        .empty-state h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #C9A84C;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #807870;
        }

        .spinner {
            border: 2px solid #272727;
            border-top: 2px solid #C9A84C;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .item-card { padding: 20px; }
            .actions { flex-direction: column; }
            .btn { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sanctuary Approval Gate</h1>
            <p class="subtitle">Release calendar for the Quiet Authority videos</p>
        </header>

        <!-- Login Screen -->
        <div class="login-screen active" id="loginScreen">
            <h2>Welcome Back</h2>
            <div style="margin-bottom: 20px; color: #807870; font-size: 0.9rem;">
                <p style="margin-bottom: 10px;">First time? Use password: <strong>approve</strong></p>
                <p>You can change it anytime.</p>
            </div>
            <input type="password" id="passwordInput" placeholder="Enter approval password" autocomplete="off">
            <button onclick="login()">Access Gate</button>
            <div id="loginError" style="color: #C1593C; margin-top: 15px; display: none;"></div>
        </div>

        <!-- Main Content -->
        <div class="content" id="content">
            <div class="controls">
                <div class="counter">
                    <span id="itemCounter">Loading...</span>
                </div>
                <button class="logout-btn" onclick="logout()">← Back to Gate</button>
            </div>

            <div id="itemDisplay"></div>
            <div id="statusMessage"></div>
        </div>

        <div id="loadingState" style="display: none;">
            <div class="loading">
                <p>Loading the release calendar...</p>
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        // The release calendar. It reads workflows/output/youtube-schedule.json and shows only those videos,
        // ordered by date. Nothing on this page uploads or moves a file.
        const SCHEDULE_URL = 'workflows/output/youtube-schedule.json';
        let savedPassword = localStorage.getItem('approvalPassword') || 'approve';

        function login() {
            const password = document.getElementById('passwordInput').value;
            if (!password) { showLoginError('Please enter a password'); return; }
            if (password !== savedPassword) { showLoginError('Incorrect password'); return; }
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('content').classList.add('active');
            loadSchedule();
        }

        function showLoginError(msg) {
            const err = document.getElementById('loginError');
            err.textContent = msg;
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 3000);
        }

        function logout() {
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('content').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function prettyDate(iso, time) {
            const d = new Date(iso + 'T12:00:00');
            const day = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            return day + ', ' + time + ' Eastern';
        }

        async function loadSchedule() {
            document.getElementById('loadingState').style.display = 'block';
            try {
                const response = await fetch(SCHEDULE_URL + '?v=' + Date.now());
                if (!response.ok) throw new Error('Could not load the schedule');
                const data = await response.json();
                const metrics = await fetchMetrics();
                const thumbs = await fetchThumbs();
                const integrity = await fetchIntegrity();
                const videos = data.videos.slice().sort((a, b) => a.date.localeCompare(b.date));
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('itemCounter').textContent = videos.length + ' videos scheduled';
                document.getElementById('itemDisplay').innerHTML = renderIntegrity(integrity) + renderActions(data.action_cards || []) + renderReview(data.pending_review || []) + videos.map(v => `
                    <div class="item-card">
                        <div class="platform-badge">WEEK ${escapeHtml(v.week)} &middot; ${escapeHtml(v.version.toUpperCase())}</div>
                        <div class="item-date">${escapeHtml(prettyDate(v.date, v.time))}</div>
                        <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(v.title)}</h2>
                        <div class="item-content">${escapeHtml(v.chapters.join('\n'))}</div>
                        <div class="actions">
                            <a class="btn btn-approve" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.video)}" target="_blank" rel="noopener">Watch video</a>
                            <a class="btn btn-reject" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.card)}" target="_blank" rel="noopener">Open card</a>
                        </div>
                    </div>`).join('') + `
                    <p class="counter" style="text-align:center;">You upload each video yourself in YouTube Studio and schedule it for the date above. Nothing on this page uploads anything.</p>`
                    + renderThumbnails(thumbs) + renderInsights(metrics) + renderShorts(data.shorts || []) + renderNotes(data.status_notes || []);
            } catch (e) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('itemDisplay').innerHTML = '<div class="item-card"><p style="color: #C1593C;">' + escapeHtml(e.message) + '</p></div>';
            }
        }




        // Thumbnail cards for the five master videos, made by scripts/generate-system-thumbnails.mjs.
        async function fetchThumbs() {
            try {
                const r = await fetch('content-ops/02_thumbnail_factory/thumbnails.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        function renderThumbnails(t) {
            const head = '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">Thumbnail Cards</h2>';
            if (!t || !t.cards || !t.cards.length) return head + '<div class="item-card"><p>No thumbnail cards have been made yet.</p></div>';
            const cards = t.cards.map(c => `
                <div class="item-card">
                    <div class="platform-badge">${escapeHtml(String(c.video).toUpperCase())}</div>
                    <a href="${escapeHtml(c.file)}" target="_blank" rel="noopener"><img src="${escapeHtml(c.file)}" alt="Thumbnail card for ${escapeHtml(c.scripture_title.join(' and '))}" style="width:100%; border:1px solid #272727; display:block;"></a>
                    <div class="item-date" style="margin-top:12px;">${escapeHtml(c.scripture_title.join(' and '))}: ${escapeHtml(c.sub)}</div>
                </div>`).join('');
            return head + cards + '<p class="counter" style="text-align:center;">Each card is 1280 by 720, with its scripture title in gold Cinzel inside the 780 pixel text limit.</p>';
        }

        // Engagement Metrics Tracker. It shows only numbers that are in the channel log. Until a video has numbers it says so.
        async function fetchMetrics() {
            try {
                const r = await fetch('workflows/output/engagement-metrics.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        function gauge(label, value, hint) {
            const has = typeof value === 'number';
            const ring = has ? `conic-gradient(#C9A84C ${value}%, #272727 0)` : '#272727';
            return `<div style="text-align:center; width:30%; min-width:110px;">
                <div style="width:96px; height:96px; border-radius:50%; margin:0 auto; background:${ring}; display:flex; align-items:center; justify-content:center;">
                    <div style="width:72px; height:72px; border-radius:50%; background:#0d0d0d; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; font-weight:700; font-size:${has ? '1.7rem' : '0.8rem'}; color:${has ? '#C9A84C' : '#807870'};">${has ? Math.round(value) + '%' : 'no data yet'}</div>
                </div>
                <div style="margin-top:8px; font-size:0.85rem;">${escapeHtml(label)}</div>
                <div style="font-size:0.72rem; color:#807870;">${escapeHtml(hint)}</div>
            </div>`;
        }

        function renderInsights(m) {
            const head = '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">Engagement Metrics Tracker</h2>';
            if (!m || !m.suites) return head + '<div class="item-card"><p>The tracker has not been set up yet.</p></div>';
            const cards = m.suites.map(x => `
                <div class="item-card">
                    <div class="platform-badge">${escapeHtml(x.id.toUpperCase())}</div>
                    <div class="item-date">${escapeHtml(x.title)}${x.has_data ? '' : ' (not out yet, or no numbers yet)'}</div>
                    <div style="display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap;">
                        ${gauge('Hook rate', x.hook_rate, 'still watching at 30 seconds')}
                        ${gauge('Retention drop-off', x.retention_dropoff, 'left before the end')}
                        ${gauge('Traffic redirection', x.traffic_redirection, 'clicked to sanctuary-grace.com')}
                    </div>
                </div>`).join('');
            const rows = m.pairs.map(p => `
                <div style="display:flex; gap:12px; justify-content:space-between; padding:10px 0; border-top:1px solid #272727;">
                    <div>${escapeHtml(p.video.toUpperCase())} paired with ${p.short ? 'Clip ' + escapeHtml(p.short.clip) + ': ' + escapeHtml(p.short.name) : 'no short numbers yet'}</div>
                    <div style="color:#C9A84C;">${p.short ? escapeHtml(p.short.score) + ' engagement' : ''}</div>
                </div>`).join('');
            const pairs = '<div class="item-card"><div class="platform-badge">TOP SHORT FOR EACH VIDEO</div><div class="item-date">Sorted from highest engagement to lowest</div>' + rows + '</div>';
            return head + cards + pairs + '<p class="counter" style="text-align:center;">These numbers come only from the channel log. Nothing here is estimated. Updated ' + escapeHtml(m.updated) + '.</p>';
        }

        // Visual integrity result from scripts/verify-visual-integrity.mjs. A video that fails shows as BLOCKED.
        async function fetchIntegrity() {
            try {
                const r = await fetch('workflows/output/visual-integrity.json?v=' + Date.now());
                return r.ok ? await r.json() : null;
            } catch (e) { return null; }
        }

        function renderIntegrity(v) {
            if (!v || !v.videos) return '';
            const blocked = !v.layout_ok || v.videos.some(x => !x.ok);
            const rows = v.videos.map(x => `
                <div style="padding:8px 0; border-top:1px solid #272727; color:${x.ok ? '#F5F0E8' : '#C1593C'};">
                    ${escapeHtml(x.video)}: ${x.ok ? 'passed, ' + escapeHtml(x.frames) + ' frames, longest black run before the fade ' + escapeHtml(x.longest_black_run_before_fade) + ' frames' : 'BLOCKED. ' + escapeHtml(x.problems.join(' '))}
                </div>`).join('');
            return `
                <div class="item-card" style="border-color:${blocked ? '#C1593C' : '#C9A84C'};">
                    <div class="platform-badge">VISUAL INTEGRITY, ${escapeHtml(v.checked)}</div>
                    <div class="item-date">${blocked ? 'BLOCKED. Do not approve until this is fixed.' : 'Passed'}</div>
                    <p>${escapeHtml(v.rule)} The picture and music fade out together over the last 8 seconds. That final fade is part of the standard and is not counted.</p>
                    ${(v.notes || []).map(n => `<p>${escapeHtml(n)}</p>`).join('')}
                    ${rows}
                </div>`;
        }

        // Action and status cards for Grace, shown at the very top of the gate.
        function renderActions(cards) {
            return cards.map(c => `
                <div class="item-card" style="border-color:#C1593C;">
                    <div class="platform-badge">${escapeHtml(c.badge)}</div>
                    <div class="item-date">${escapeHtml(c.status)}</div>
                    <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(c.title)}</h2>
                    <div class="item-content">${escapeHtml(c.steps.join('\n'))}</div>
                    <p class="counter" style="margin-top:14px;">${escapeHtml(c.note)}</p>
                </div>`).join('');
        }

        // New videos waiting for Grace's review, shown at the very top, before the release calendar.
        function renderReview(items) {
            return items.map(v => `
                <div class="item-card" style="border-color:#C9A84C;">
                    <div class="platform-badge">${escapeHtml(v.label)} &middot; ${escapeHtml(v.series)} &middot; ${escapeHtml(v.version.toUpperCase())}</div>
                    <div class="item-date">${escapeHtml(v.note)}</div>
                    <h2 style="font-family: 'Cormorant Garamond', serif; color: #C9A84C; margin-bottom: 20px;">${escapeHtml(v.title)}</h2>
                    <div class="item-content">${escapeHtml(v.chapters.join('\n'))}</div>
                    <div class="actions">
                        <a class="btn btn-approve" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.video)}" target="_blank" rel="noopener">Watch video</a>
                        <a class="btn btn-reject" style="text-decoration:none; text-align:center;" href="${escapeHtml(v.card)}" target="_blank" rel="noopener">Open card</a>
                    </div>
                </div>`).join('');
        }

        // The 60 second vertical shorts, grouped by the video they come from. Post each one after its full video is out.
        function renderShorts(shorts) {
            if (!shorts.length) return '';
            const order = ['v9', 'v13', 'v11', 'v10', 'v12'];
            const groups = order.map(vid => {
                const clips = shorts.filter(x => x.video === vid);
                if (!clips.length) return '';
                const date = prettyDate(clips[0].full_video_date, '5:00 AM');
                const rows = clips.map(x => `
                    <div style="display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid #272727; ${x.skip ? 'opacity:0.5;' : ''}">
                        <div>Clip ${escapeHtml(x.clip)}: ${escapeHtml(x.name)}${x.skip ? ' (skip: ' + escapeHtml(x.skip_reason) + ')' : ''}</div>
                        <div style="display:flex; gap:10px;">
                            <a href="${escapeHtml(x.file)}" target="_blank" rel="noopener" style="color:#C9A84C;">Watch</a>
                            <a href="${escapeHtml(x.caption)}" target="_blank" rel="noopener" style="color:#C9A84C;">Caption</a>
                        </div>
                    </div>`).join('');
                return `<div class="item-card"><div class="platform-badge">SHORTS &middot; ${escapeHtml(vid.toUpperCase())}</div><div class="item-date">Post after the full video, ${escapeHtml(date)}</div>${rows}</div>`;
            }).join('');
            return '<h2 style="font-family: \'Cormorant Garamond\', serif; color: #C9A84C; text-align:center; margin: 40px 0 20px;">Shorts, Reels and Pins</h2>' + groups +
                '<p class="counter" style="text-align:center;">Each short ends by pointing to the full video and sanctuary-grace.com. The caption file has the YouTube, Instagram and Pinterest text. You post every short yourself.</p>';
        }


        // Short status notes at the bottom of the gate.
        function renderNotes(notes) {
            return notes.map(n => `<div class="item-card"><div class="platform-badge">${escapeHtml(n.badge)}</div><p>${escapeHtml(n.text)}</p></div>`).join('');
        }

        window.addEventListener('load', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
