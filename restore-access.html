<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restore My Access — Sanctuary Grace Ministry</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;600&family=Jost:wght@300;400;500&display=swap');

  :root{
    --bg:#0d0d0d;
    --panel:#141414;
    --gold:#C9A84C;
    --terracotta:#C1593C;
    --cream:#F5F0E8;
    --parchment:#C4A47C;
    --muted:#9a9a94;
    --rule:rgba(201,168,76,0.22);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Jost',sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:'Cormorant Garamond',serif; font-weight:600; margin:0; color:var(--gold);}
  a{color:inherit;}
  .wrap{max-width:560px; margin:0 auto; padding:0 28px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:26px 0; border-bottom:1px solid var(--rule);}
  .brandmark{font-family:'Cinzel',serif; letter-spacing:0.14em; font-size:13px; color:var(--cream); text-transform:uppercase;}
  .back-link{font-family:'Jost',sans-serif; font-size:12px; color:var(--muted); text-decoration:none; letter-spacing:0.04em;}
  .back-link:hover{color:var(--gold);}

  .hero{padding:64px 0 20px; text-align:center;}
  .ornament{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:24px;}
  .ornament .ln{width:60px; height:1px; background:var(--gold);}
  .ornament .dot{width:6px; height:6px; background:var(--gold); transform:rotate(45deg);}
  .label{font-family:'Cinzel',serif; letter-spacing:0.22em; text-transform:uppercase; font-size:12px; color:var(--parchment);}
  .hero h1{font-size:clamp(32px,6vw,46px); line-height:1.1;}
  .hero p.lede{max-width:460px; margin:18px auto 0; font-size:15.5px; line-height:1.75; color:var(--cream); opacity:0.9;}

  .panel{background:var(--panel); border:1px solid var(--rule); border-radius:2px; padding:32px 28px; margin:36px 0;}
  label{display:block; font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--parchment); margin-bottom:10px;}
  input[type=email]{
    width:100%; background:var(--bg); border:1px solid var(--rule); color:var(--cream);
    font-family:'Jost',sans-serif; font-size:15px; padding:13px 14px; border-radius:2px;
  }
  input[type=email]:focus{outline:none; border-color:var(--gold);}
  button{
    margin-top:18px; width:100%; padding:14px; border:1px solid var(--gold); background:transparent;
    color:var(--gold); font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    border-radius:2px; cursor:pointer; transition:background .2s ease,color .2s ease;
  }
  button:hover{background:var(--gold); color:var(--bg);}
  button:disabled{opacity:0.5; cursor:default;}
  button:disabled:hover{background:transparent; color:var(--gold);}

  .status{margin-top:18px; font-size:14px; line-height:1.7; display:none;}
  .status.show{display:block;}
  .status.error{color:var(--terracotta);}
  .gate-list{list-style:none; margin:14px 0 0; padding:0;}
  .gate-list li{padding:12px 0; border-top:1px solid var(--rule); display:flex; justify-content:space-between; align-items:center;}
  .gate-list a{font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; color:var(--gold); text-decoration:none; text-transform:uppercase;}

  footer{padding:40px 0 60px; text-align:center;}
  footer .fine{font-size:11.5px; color:var(--muted); letter-spacing:0.04em;}
  footer .fine a{text-decoration:none; border-bottom:1px solid var(--rule);}
</style>
</head>
<body>

<div class="wrap topbar">
  <div class="brandmark">Sanctuary Grace Ministry</div>
  <a class="back-link" href="foyer.html">&larr; Back to The Foyer</a>
</div>

<section class="hero wrap">
  <div class="ornament"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>
  <div class="label">Circle of Silence</div>
  <h1>Restore My Access</h1>
  <p class="lede">
    Bought a gate on another device or browser? Enter the email you paid with and we'll
    unlock whatever you've already purchased here too. No password, no account.
  </p>
</section>

<div class="wrap">
  <div class="panel">
    <label for="restoreEmail">Email address used at checkout</label>
    <input type="email" id="restoreEmail" placeholder="you@example.com" autocomplete="email">
    <button type="button" id="restoreBtn" onclick="restoreAccess()">Restore Access</button>
    <div class="status" id="restoreStatus"></div>
  </div>
</div>

<footer class="wrap">
  <div class="fine">
    Sanctuary Grace Ministry &middot; <a href="https://sanctuary-grace.com">sanctuary-grace.com</a>
  </div>
</footer>

<script>
var WORKER_URL = 'https://lively-dew-924c.tdwdemp.workers.dev';
var GATE_NAMES = {
  one: 'Gate One — HaKria', two: 'Gate Two — Sheket', three: 'Gate Three — HaMidbar',
  four: 'Gate Four — Hitkania', five: 'Gate Five — Bitachon', six: 'Gate Six — Hithavut'
};
var GATE_NUM = {one:1,two:2,three:3,four:4,five:5,six:6};

function restoreAccess(){
  var input=document.getElementById('restoreEmail');
  var btn=document.getElementById('restoreBtn');
  var status=document.getElementById('restoreStatus');
  var email=(input.value||'').trim();

  status.className='status show';
  if(!email || email.indexOf('@')===-1){
    status.className='status show error';
    status.textContent='Enter the email address you used at checkout.';
    return;
  }

  btn.disabled=true;
  status.textContent='Checking your purchases…';

  fetch(WORKER_URL+'/restore-access?email='+encodeURIComponent(email))
    .then(function(r){ return r.json(); })
    .then(function(data){
      btn.disabled=false;
      var gates=data.unlockedGates||[];
      gates.forEach(function(gate){
        try{ localStorage.setItem('gate'+GATE_NUM[gate]+'_verified','1'); }catch(e){}
      });
      if(!gates.length){
        status.className='status show';
        status.textContent="We couldn't find a purchase under that email. Check the spelling, or reach out to Grace directly if you're sure you paid.";
        return;
      }
      var html='This browser now has access to:<ul class="gate-list">';
      gates.forEach(function(gate){
        html+='<li>'+(GATE_NAMES[gate]||gate)+'<a href="gate-'+gate+'.html">Open &rarr;</a></li>';
      });
      html+='</ul>';
      status.innerHTML=html;
    })
    .catch(function(){
      btn.disabled=false;
      status.className='status show error';
      status.textContent='Something went wrong reaching the server. Please try again in a moment.';
    });
}
</script>

</body>
</html>
