<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pinterest Approval</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0d0d; --surface:#181818; --border:#272727; --gold:#C9A84C; --cream:#F5F0E8; }
  body { font-family: 'Jost', sans-serif; font-weight: 300; background: var(--bg); color: var(--cream); margin: 0; padding: 32px 16px; line-height: 1.7; }
  [hidden] { display: none !important; }
  main { max-width: 560px; margin: 0 auto; text-align: center; }
  .badge { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 2rem; color: var(--gold); margin: 12px 0 20px; }
  code { display: block; word-break: break-all; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 20px 0; font-size: 15px; color: var(--cream); }
  button { font-family: 'Jost', sans-serif; font-size: 16px; padding: 12px 24px; border: 0; border-radius: 8px; background: var(--gold); color: var(--bg); cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="badge">Sanctuary Grace</div>
  <h1>Pinterest Approval</h1>
  <p id="msg">Reading your approval code.</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copy this code</button>
  <p id="next" hidden>Step 2 of 2: paste it into the setup workflow on GitHub.</p>
</main>
<script>
  var p = new URLSearchParams(window.location.search);
  var msg = document.getElementById('msg');
  if (p.get('code')) {
    document.getElementById('code').textContent = p.get('code');
    document.getElementById('code').hidden = false;
    document.getElementById('copy').hidden = false;
    document.getElementById('next').hidden = false;
    msg.textContent = 'Approved. Here is your one-time code.';
    document.getElementById('copy').onclick = function () {
      navigator.clipboard.writeText(p.get('code')).then(function () { msg.textContent = 'Copied.'; });
    };
  } else if (p.get('error')) {
    msg.textContent = 'Pinterest did not approve the request. Please try the approval link again.';
  } else {
    msg.textContent = 'No approval code found. Please start again from the approval link.';
  }
</script>
</body>
</html>
