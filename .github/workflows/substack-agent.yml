name: Substack Agent — Daily Devotion

on:
  schedule:
    - cron: '0 11 * * *'  # 6am PT = 11am UTC
  workflow_dispatch:

jobs:
  publish-devotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run Substack Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_API_KEY: ${{ secrets.SUBSTACK_API_KEY }}
          SUBSTACK_PUB_URL: ${{ secrets.SUBSTACK_PUB_URL }}
        run: python3 workflows/scripts/substack_agent.py

      - name: Commit and push output to approval branch
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add workflows/output/
          if ! git diff --staged --quiet; then
            BRANCH="agent-output/substack-$(date +%Y-%m-%d)"
            git checkout -b "$BRANCH"
            git commit -m "Substack Agent: $(date +%Y-%m-%d) devotion draft — ready for review"
            git push -u origin "$BRANCH"
            echo "Draft pushed to $BRANCH — Grace reviews and publishes"
          else
            echo "No new content to commit"
          fi
