name: Substack Agent, Daily Devotion

on:
  # PAUSED 2026-10-03 by Grace. Daily schedule removed so nothing runs on its own.
  # To resume, restore: schedule: - cron: '0 11 * * *'
  workflow_dispatch:

# This agent only saves a DRAFT on Substack. It never publishes. Grace reviews and publishes herself.
# Never run two at once, so the same draft is not created twice.
concurrency:
  group: substack-agent
  cancel-in-progress: false

jobs:
  publish-devotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Substack secret is present
        env:
          SUBSTACK_COOKIE_ID: ${{ secrets.SUBSTACK_COOKIE_ID }}
        run: |
          if [ -z "$SUBSTACK_COOKIE_ID" ]; then
            echo "::error::SUBSTACK_COOKIE_ID is not set in repository secrets. Nothing was published."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Substack Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSTACK_COOKIE_ID: ${{ secrets.SUBSTACK_COOKIE_ID }}
        run: python3 workflows/scripts/substack_agent.py

      - name: Commit and push output
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add -f workflows/output/substack-pending/
          if ! git diff --staged --quiet; then
            git commit -m "Substack Agent: $(date +%Y-%m-%d) devotion draft, ready for Grace approval"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "Push failed after 3 attempts"; exit 1; }
            echo "✅ Devotion saved to workflows/output/substack-pending/, visible in Approval Gate for Grace review"
          else
            echo "No new content to commit"
          fi
