name: Substack Agent — Daily Devotion

on:
  schedule:
    - cron: '0 11 * * *'  # 6am PT = 11am UTC
  workflow_dispatch:

jobs:
  publish-devotion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Substack Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 workflows/scripts/substack_agent.py

      - name: Commit and push output
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add -f workflows/output/substack-pending/
          if ! git diff --staged --quiet; then
            git commit -m "Substack Agent: $(date +%Y-%m-%d) devotion draft — ready for Grace approval"
            git push origin HEAD
            echo "✅ Devotion saved to workflows/output/substack-pending/ — visible in Approval Gate for Grace review"
          else
            echo "No new content to commit"
          fi
