name: YouTube Agent — Generate Video Script + MP4

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y ffmpeg ffprobe imagemagick

      - name: Install Python dependencies
        run: |
          pip install pillow gtts

      - name: Run YouTube Agent (generates script + audio + slides + MP4)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 workflows/scripts/youtube_agent.py

      - name: Commit script metadata to main
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add -f workflows/output/youtube-pending/
          git add -f workflows/output/youtube-log.md
          if ! git diff --staged --quiet; then
            git commit -m "YouTube Agent: $(date +%Y-%m-%d) video script + MP4 ready — Grace downloads from Actions artifacts"
            git push origin main
            echo "✅ Script metadata saved to workflows/output/youtube-pending/"
          else
            echo "No new content to commit"
          fi

      - name: Upload MP4 as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-$(date +%Y-%m-%d)
          path: workflows/output/youtube_video_*.mp4
          retention-days: 30
