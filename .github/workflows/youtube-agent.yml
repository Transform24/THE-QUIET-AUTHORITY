name: YouTube Agent — Weekly Video Script

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run YouTube Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 workflows/scripts/youtube_agent.py

      - name: Commit and push output to approval branch
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add workflows/output/
          if ! git diff --staged --quiet; then
            BRANCH="agent-output/youtube-$(date +%Y-%m-%d)"
            git checkout -b "$BRANCH"
            git commit -m "YouTube Agent: $(date +%Y-%m-%d) script draft — ready for recording"
            git push -u origin "$BRANCH"
            echo "Draft pushed to $BRANCH — Grace reviews and records"
          else
            echo "No new content to commit"
          fi
