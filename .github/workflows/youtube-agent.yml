name: YouTube Agent — Generate Script

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run YouTube Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 workflows/scripts/youtube_agent.py

      - name: Commit script to main
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add -f workflows/output/youtube-pending/
          git add -f workflows/output/youtube-log.md
          if ! git diff --staged --quiet; then
            git commit -m "YouTube Agent: $(date +%Y-%m-%d) script — ready for Grace to record and upload"
            git push origin main
            echo "✅ Script saved to workflows/output/youtube-pending/"
          else
            echo "No new content to commit"
          fi
