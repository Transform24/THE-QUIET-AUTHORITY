name: Remotion Render Gates (vertical)

# Renders the six gates of the Circle of Silence as vertical scripture reveals from
# circle-of-silence/remotion/src/data/gates.json, with music2.mp3 and music3.mp3 from the
# repository root looping softly underneath. Same look as the Psalm 91 video.
# It checks the script first, then renders. It needs NO secrets and NEVER uploads anywhere.
# The finished videos are saved as a downloadable run artifact. Grace reviews them herself.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to render'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - clips
          - both

# Read-only. This workflow never writes to the repository and reads no secrets.
permissions:
  contents: read

# One render at a time.
concurrency:
  group: remotion-gates
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: circle-of-silence/remotion
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: circle-of-silence/remotion/package-lock.json

      - name: Check the two engines match and stay on brand
        working-directory: .
        run: node scripts/check-remotion-sync.mjs

      - name: Install dependencies (exact versions from the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Prove the script checker stops bad files
        run: npm run test:validator

      - name: Check the gates script and the music
        run: npm run validate:gates

      - name: Install system libraries for the headless browser
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2

      - name: Make sure the headless browser is available
        run: npx remotion browser ensure

      # Each render script below checks the script and stages the music again before it renders.
      - name: Render all six gates in one video
        if: ${{ inputs.mode == 'full' || inputs.mode == 'both' }}
        run: npm run render:gates

      - name: Render one clip per gate
        if: ${{ inputs.mode == 'clips' || inputs.mode == 'both' }}
        run: npm run render:gates:clips

      - name: Save the videos (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: gates-vertical-videos
          path: circle-of-silence/remotion/out/
          if-no-files-found: error
          retention-days: 14
