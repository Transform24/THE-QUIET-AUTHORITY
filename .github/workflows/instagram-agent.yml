name: Instagram Agent — Daily Post (PAUSED)

on:
  schedule:
    - cron: '0 14 * * *'  # 2pm UTC
  workflow_dispatch:

jobs:
  post-content:
    runs-on: ubuntu-latest
    if: false  # PAUSED until account restriction lifts (7-14 days from account creation)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run Instagram Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_DEFAULT_IMAGE_URL: ${{ secrets.IG_DEFAULT_IMAGE_URL }}
        run: python3 workflows/scripts/instagram_agent.py

      - name: Set up Node for Remotion rendering
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Remotion and render Reel
        run: |
          npm install -g remotion @remotion/cli
          # Remotion will read caption from output and render Reel MP4
          # TODO: Create remotion-render.js for Instagram Reel generation
          echo "Remotion Reel rendering coming in next step"

      - name: Commit and push output to approval branch
        run: |
          git config user.name "TQA Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add workflows/output/instagram-pending/
          if ! git diff --staged --quiet; then
            BRANCH="agent-output/instagram-pending-$(date +%Y-%m-%d)"
            git checkout -b "$BRANCH"
            git commit -m "Instagram Agent: $(date +%Y-%m-%d) caption + Reel → workflows/output/instagram-pending/ — ready for Grace approval"
            git push -u origin "$BRANCH"
            echo "✅ Caption + Reel saved to workflows/output/instagram-pending/ → Grace reviews → moves to -approved/ → auto-posts"
          else
            echo "No new content to commit"
          fi
