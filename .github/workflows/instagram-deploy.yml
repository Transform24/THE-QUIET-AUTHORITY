name: Instagram Deploy — Post Approved Content

on:
  schedule:
    - cron: '0 14 * * *'  # Daily 2pm UTC
  workflow_dispatch:
    inputs:
      post_date:
        description: 'Post date to deploy (YYYY-MM-DD) — leave blank for latest'
        required: false
        default: ''

jobs:
  deploy-post:
    runs-on: ubuntu-latest
    if: ${{ vars.INSTAGRAM_RESTRICTION_LIFTED == 'true' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for approved posts
        run: |
          if [ -d "workflows/output/instagram-approved" ] && [ "$(ls -A workflows/output/instagram-approved)" ]; then
            echo "✅ Approved posts found in workflows/output/instagram-approved/"
            ls -la workflows/output/instagram-approved/
          else
            echo "⚠️  No approved posts to deploy. Grace must move posts from -pending/ to -approved/ first."
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Deploy to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 workflows/scripts/instagram-deploy.py

      - name: Commit deployment log
        run: |
          git config user.name "TQA Deploy Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add workflows/instagram-log.md workflows/output/instagram-approved/
          if ! git diff --staged --quiet; then
            git commit -m "Instagram Deploy: Posted approved content"
            git push origin main
          fi
