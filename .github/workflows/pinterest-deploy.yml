name: Pinterest Agent — Auto Post Daily

on:
  schedule:
    - cron: '0 14 * * *'  # Daily 2pm UTC (9am EST)
  workflow_dispatch:

jobs:
  post-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run Pinterest Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python3 workflows/scripts/pinterest-deploy.py

      - name: Commit log
        run: |
          git config user.name "TQA Deploy Agent"
          git config user.email "noreply@sanctuarygrace.com"
          git add workflows/output/pin-log.md
          if ! git diff --staged --quiet; then
            git commit -m "Pinterest Agent: Auto posted pin"
            git push origin main
          fi
