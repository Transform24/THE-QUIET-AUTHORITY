name: Create Context Files
on:
  workflow_dispatch:
jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build all context files in one commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, urllib.request, urllib.error

          TOKEN = os.environ['GH_TOKEN']
          REPO = 'Transform24/THE-QUIET-AUTHORITY'

          def api(method, path, data=None):
              url = 'https://api.github.com' + path
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method, headers={
                  'Authorization': 'Bearer ' + TOKEN,
                  'Content-Type': 'application/json',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'context-creator'
              })
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print('HTTP ' + str(e.code) + ': ' + e.read().decode())
                  raise

          ref = api('GET', '/repos/' + REPO + '/git/refs/heads/main')
          base_sha = ref['object']['sha']
          commit_info = api('GET', '/repos/' + REPO + '/git/commits/' + base_sha)
          base_tree = commit_info['tree']['sha']

          cf = api('GET', '/repos/' + REPO + '/contents/CLAUDE.md')
          claude_content = base64.b64decode(cf['content']).decode('utf-8')

          ROUTING = """
## ROUTING TABLE — READ THIS FIRST

| Task | Read | Skip |
|---|---|---|
| Gate 1 | `context/gate-1.md` | everything else |
| Email / Systeme.io | `context/gate-1.md` | everything else |
| Pinterest | `context/channels.md` | everything else |
| Substack | `context/channels.md` | everything else |
| YouTube | `context/channels.md` | everything else |
| Products / Stripe | `context/products.md` | everything else |
| Infrastructure | `context/system.md` | everything else |

---
"""

          TITLE = '# THE QUIET AUTHORITY — AGENT SOP\n'
          new_claude = claude_content.replace(TITLE, TITLE + ROUTING, 1)

          SYSTEM = """# System Map — Tools, Status, Limits

| Tool | Purpose | Status | Limits / Notes |
|---|---|---|---|
| GitHub Pages | Hosting | Works perfectly | ~60s deploy from main |
| Stripe | Payments | Live | Webhook active: we_1TmPsDDvGX7GhwdzZ15UzERO |
| Systeme.io | Email automation | UI only | REST API has no campaign endpoint. MCP requires OAuth. Load emails via UI: Emails Campaigns New |
| Pinterest agent | Content posting | Running | PINTEREST_ACCESS_TOKEN in GitHub Secrets |
| Substack | Newsletter | Blocked — HTTP 403 | Unlock: add post-via-email address in Substack Settings Import |
| YouTube | Video | Blocked — missing token | YOUTUBE_REFRESH_TOKEN missing. Needs OAuth flow once |
| Instagram | Social | Frozen | Meta account restriction — no path forward until restriction lifted |
| Make.com | Automation | Eliminated | Removed from stack |
| Cowork | File access | Sandboxed | Cannot access Windows filesystem from Linux sandbox |
"""

          GATE1 = """# Gate 1 — HaKria — The Calling

**Status:** BUILT — needs email sequence loaded in Systeme.io

## Stripe
- Product ID: prod_Ul9eX4XJZNXIem
- Payment link: https://buy.stripe.com/eVqfZh8Ba8Od0Es8YGcQU0w

## Systeme.io
- Tag: gate-1-buyer
- Tag ID: 2068973

## Email Sequence — 6 Emails, Guilty Giver Profile

| Day | Subject |
|---|---|
| 0 | You are not here by accident |
| 3 | The woman who could not stop |
| 5 | What you have been carrying was never yours to carry alone |
| 7 | Your brain dump — a quiet place to name what you have been carrying |
| 10 | 12 declarations for the woman who is done proving |
| 14 | The next room is ready when you are |

## Next Action
Load 6 emails into Systeme.io:
**Emails Campaigns New Gate 1 — The Call — Guilty Giver**
- Sender name: Grace Turner
- Sender email: grace@sanctuary-grace.com
- Trigger: tag gate-1-buyer (ID 2068973) is added

## gate-one.html
- BUY_LINK_PLACEHOLDER replaced with payment link
- Committed to both repos: Transform24/THE-QUIET-AUTHORITY and the-circle-of-silence
"""

          CHANNELS = """# Channels — Status and Credentials

## Pinterest
- URL: sanctuarygrace.com
- App ID: 1574878
- Agent: running
- Secret: PINTEREST_ACCESS_TOKEN in GitHub Secrets
- Board IDs: in GitHub Secrets
- Approval gate: approval-gate.html

## Substack
- URL: 5apop2sotwm.substack.com
- Author: Grace Turner
- Subscribers: 2
- Secret: SUBSTACK_PUBLICATION_ID in GitHub Secrets
- Status: Blocked — HTTP 403
- Unlock: add post-via-email address in Substack Settings Import

## YouTube
- Channel: youtube.com/@TheQuietAuthority-f1z
- Secrets in GitHub: YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET
- Missing: YOUTUBE_REFRESH_TOKEN — needs OAuth flow once to generate
- Agent writes scripts only until token added
"""

          PRODUCTS = """# Products — All Stripe Products, Links, and Prices

## Wall Art — Stripe (live)

| Profile | Price | Link |
|---|---|---|
| A — The Striving Achiever | $9.99 | https://buy.stripe.com/14AbJ1bNm3tT9aY3EmcQU0n |
| B — The Depleted Survivor | $9.99 | https://buy.stripe.com/dRm9ATg3Cc0p2MA2AicQU0r |
| C — The Guilty Giver | $9.99 | https://buy.stripe.com/7sYdR95oY3tT1IwdeWcQU0q |
| D — The Lost Wanderer | $9.99 | https://buy.stripe.com/5kQdR92cM5C1af23EmcQU0o |
| Bundle — All Four | $29.99 | https://buy.stripe.com/7sY4gz5oY4xXbj6caScQU0l |

## Devotionals — Stripe (live)

| Product | Price | Link |
|---|---|---|
| Week 1 — Vision | $4.99 | https://buy.stripe.com/cNieVdbNm6G586UdeWcQU03 |
| Week 2 — Renewal | $4.99 | https://buy.stripe.com/3cI7sL18I7K9evi1wecQU04 |
| Week 3 — Peace | $4.99 | https://buy.stripe.com/14A7sL8Ba4xX9aY7UCcQU06 |
| Week 4 — Calling | $4.99 | https://buy.stripe.com/eVqeVd7x66G5gDq0sacQU02 |
| Bundle all 4 | $19.96 | https://buy.stripe.com/4gM6oH6t28Od5YM3EmcQU0k |

## Books — Stripe (live)

| Product | Price | Link |
|---|---|---|
| The Quiet Authority | $15.99 | https://buy.stripe.com/00w3cv5oYc0p0EscaScQU0d |
| The Parable of the Cocoon | $15.99 | https://buy.stripe.com/eVq3cv8Ba6G5bj6fn4cQU0g |
| R.E.S.T. Workbook | Free | https://sanctuarygrace.store |

## Courses / Gates — Stripe (live)

| Product | Price | Link |
|---|---|---|
| Gate 1 Circle of Silence | $9 | https://buy.stripe.com/eVqfZh8Ba8Od0Es8YGcQU0w |
| The Woman Who Pours | $15.99 | standalone product |

## Amazon Affiliate (tag: sanctuarygrac-20)

All links in index.html SACRED_SPACE data. Do not modify link structure.
Products: Weighted fleece throw, Travel mug, Prayer journal, Flameless candles, Butterfly mug, Diffuser, Leather journal, Parallel Bible
Psalm 91 link (all 4 profiles): https://amzn.to/3REMW6E
"""

          files = {
              'context/system.md': SYSTEM,
              'context/gate-1.md': GATE1,
              'context/channels.md': CHANNELS,
              'context/products.md': PRODUCTS,
              'CLAUDE.md': new_claude,
          }

          tree_items = []
          for path, content in files.items():
              blob = api('POST', '/repos/' + REPO + '/git/blobs', {
                  'content': content,
                  'encoding': 'utf-8'
              })
              tree_items.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              print('Blob: ' + path)

          new_tree = api('POST', '/repos/' + REPO + '/git/trees', {
              'base_tree': base_tree,
              'tree': tree_items
          })

          new_commit = api('POST', '/repos/' + REPO + '/git/commits', {
              'message': 'feat: add context files and routing table to CLAUDE.md',
              'tree': new_tree['sha'],
              'parents': [base_sha]
          })

          api('PATCH', '/repos/' + REPO + '/git/refs/heads/main', {
              'sha': new_commit['sha'],
              'force': False
          })

          print('COMMIT: https://github.com/' + REPO + '/commit/' + new_commit['sha'])
          PYEOF
