name: Delete All Non-Main Branches
on:
  workflow_dispatch:
jobs:
  delete-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete all non-main branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: branches } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/'
            });
            let deleted = [];
            for (const branch of branches) {
              const name = branch.ref.replace('refs/heads/', '');
              if (name === 'main') continue;
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${name}`
              });
              deleted.push(name);
              console.log(`Deleted: ${name}`);
            }
            console.log(`\nTotal deleted: ${deleted.length}`);
            console.log('Branches: ' + deleted.join(', '));
